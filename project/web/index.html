  <script>
    // Offline map preparation: remember every file this page loads from its
    // own origin and the Flutter/Google font CDNs, from the very start, so
    // "Prepare offline map" can store the exact shell, engine and fonts in
    // use (the browser's own timing list keeps only 250 entries). URLs only.
    (function () {
      var seen = window.__streamerResources = [];
      var allowed = [location.origin, 'https://www.gstatic.com', 'https://fonts.gstatic.com'];
      function add(entries) {
        entries.forEach(function (entry) {
          try {
            var url = new URL(entry.name);
            if (allowed.indexOf(url.origin) >= 0 && seen.indexOf(entry.name) < 0 && seen.length < 3000) {
              seen.push(entry.name);
            }
          } catch (e) {}
        });
      }
      try {
        new PerformanceObserver(function (list) { add(list.getEntries()); })
          .observe({ type: 'resource', buffered: true });
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="manifest.json">

  <!--

  <!--
    Offline map: a network-first worker that answers from the cache the app
    fills only when the user prepares the offline map. See
    streamer_offline_sw.js; it never caches other origins' API responses.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.__hadayahPageReady = new Promise(function (resolve) {
        window.addEventListener('load', function () {
          var ports = [], finished = false;
          var timer = setTimeout(function () { finish(false); }, 15000);
          function finish(ready) {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            navigator.serviceWorker.removeEventListener('controllerchange', identify);
            ports.forEach(function (port) { port.close(); });
            resolve(ready);
          }
          function identify() {
            navigator.serviceWorker.ready.then(function (registration) {
              if (finished) return;
              var channel = new MessageChannel();
              ports.push(channel.port1);
              channel.port1.onmessage = function (event) { finish(event.data === true); };
              (navigator.serviceWorker.controller || registration.active).postMessage({
                type: 'page-build',
                buildId: document.querySelector('meta[name="hadayah-build"]')?.content
              }, [channel.port2]);
            }).catch(function () { finish(false); });
          }
          // During an upgrade ready may still resolve the old worker. Retry
          // identification when the new worker claims this committed page.
          navigator.serviceWorker.addEventListener('controllerchange', identify);
          navigator.serviceWorker.register('streamer_offline_sw.js')
            .then(identify).catch(function () { finish(false); });
        });
      });
    }
  </script>
