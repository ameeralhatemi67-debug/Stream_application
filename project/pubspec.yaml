name: streamer_app
description: "Educational Cloud Streaming Application for Saudi Arabia (AlSharqia / KSA)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Routing & State Architecture
  go_router: ^14.2.0
  provider: ^6.1.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0

  # Localization (English LTR & Arabic RTL)
  easy_localization: ^3.0.7

  # GIS Mapping & Vector Rendering
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.1
  cached_network_image: ^3.3.1
  latlong2: ^0.9.1
  flutter_svg: ^2.0.9
  vector_math: ^2.1.4

  # Media Streaming & Video Viewports
  flutter_vlc_player: ^7.4.1
  youtube_player_iframe: ^5.2.1
  wakelock_plus: ^1.2.8
  webview_flutter: ^4.8.0
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1

  # Design System & UI Typography
  google_fonts: ^6.2.1
  top_snackbar_flutter: ^3.1.0

  # Authentication & Media Picker
  google_sign_in: ^6.2.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/map/gadm41_SAU_2.svg
    - assets/i18n/en.json
    - assets/i18n/ar.json
    - assets/images/Ahmed_Amer_YouTube_files/
    - assets/images/Amir_Alhatemi/
    - assets/images/BidonWaraq/
    - assets/images/Dalilak/
    - assets/images/quran/
