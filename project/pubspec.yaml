name: streamer_app
description: "Educational Cloud Streaming Application for Saudi Arabia (AlSharqia / KSA)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Routing & State Architecture
  go_router: ^14.2.0
  provider: ^6.1.2
  http: ^1.2.0
  # Direct imports for the map pack (hash check, browser offline storage).
  crypto: ^3.0.7
  web: ^1.1.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.5

  # Localization (English LTR & Arabic RTL)
  easy_localization: ^3.0.7

  # GIS Mapping & Vector Rendering
  # Exact pins: qualified together in P5 tri-city G0 (see
  # brief/evidence/2026-09-26/p5-tricity-map-upgrade/). Upgrade only with a
  # fresh qualification of the local PMTiles adapter and label rendering.
  flutter_map: 8.3.2
  flutter_map_vector_tiles: 2.9.0
  cached_network_image: ^3.3.1
  latlong2: ^0.9.1
  flutter_svg: ^2.0.9
  vector_math: ^2.1.4

  # Media Streaming & Video Viewports
  youtube_player_iframe: ^5.2.1
  wakelock_plus: ^1.2.8
  webview_flutter: ^4.8.0
  webview_flutter_android: ^4.12.0
  webview_flutter_wkwebview: ^3.25.1

  # Design System & UI Typography
  top_snackbar_flutter: ^3.1.0

  # Media Picker
  image_picker: ^1.1.2

  # Native OS share sheet (Private Streaming invite link)
  share_plus: ^10.1.4

  # Phone Camera/Mic Broadcasting (v0.7) -- runtime permission requests for
  # CAMERA/RECORD_AUDIO ahead of the native RootEncoder RTMP publisher.
  permission_handler: ^11.3.1

  # Backend
  supabase_flutter: ^2.17.2
  uuid: ^4.6.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  geolocator: ^14.0.2
  sign_in_with_apple: ^8.1.0
  hijri: ^3.0.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  # Real-engine map render checks on Windows/Android (integration_test/).
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Generates the launcher, adaptive and web icons from the owner's supplied
  # logo. A dev dependency: nothing it produces is imported at runtime.
  flutter_launcher_icons: ^0.14.4

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  assets:
    # Bundle only runtime artwork; the SVG/PNG source masters stay on disk.
    - assets/logo/black.svg
    # Hidayah Gold mark at display size (plus a 3.0x variant for phones). The
    # 2.9 MB master clearlogo2.png stays on disk for the launcher-icon script;
    # brief/tools/make_hidayah_display_logo.py rebuilds these from it.
    - assets/logo/hidayah_mark.png
    # Browser tab icon while the Hidayah Gold palette is on (web only).
    - assets/logo/hidayah_icon_192.png
    - assets/Language.svg
    - assets/i18n/en.json
    - assets/i18n/ar.json
    # Bundled three-city map pack (hash-verified against manifest.json).
    - assets/maps/tricity/
    - assets/images/Ahmed_Amer_YouTube_files/
    - assets/images/Amir_Alhatemi/
    - assets/images/BidonWaraq/
    - assets/images/Dalilak/
    - assets/images/quran/
    - assets/images/avatars/
    - assets/images/studio_help/
    # Canopy design-system icons and lattice texture (streaming screens).
    - assets/canopy/icons/
    - assets/canopy/textures/
    - assets/images/hadayah_association_logo.png

  fonts:
    # Variable fonts are listed once: the engine downloads and registers every
    # entry and ignores the weight field, so a second entry for the same file
    # was a second download of it on the web (audit 2026-10-21, P0-5).
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700
    # Hidayah Gold website display face (SIL OFL, assets/fonts/OFL-Reem-Kufi.txt).
    - family: Reem Kufi
      fonts:
        - asset: assets/fonts/ReemKufi-Variable.ttf


# Launcher, adaptive and web icons, built by `dart run flutter_launcher_icons`
# from the layers `brief/tools/make_launcher_assets.py` derives from the
# owner's supplied logo. See Core_files/Desgin.md for which supplied file is
# which. Re-run the Python script first if the logo ever changes.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  # The finished square tile, for the legacy mipmaps on Android 7 and below.
  image_path: "assets/launcher/icon_1024.png"
  # Adaptive icon (Android 8+): a flat background with the mark inset into the
  # safe zone, so a circular or squircle mask cannot clip it.
  adaptive_icon_background: "assets/launcher/adaptive_background.png"
  adaptive_icon_foreground: "assets/launcher/adaptive_foreground.png"
  # Themed icon (Android 13+): a silhouette the launcher tints itself.
  adaptive_icon_monochrome: "assets/launcher/adaptive_monochrome.png"
  min_sdk_android: 24
  web:
    generate: true
    image_path: "assets/launcher/icon_1024.png"
    background_color: "#151D24"
    theme_color: "#151D24"
