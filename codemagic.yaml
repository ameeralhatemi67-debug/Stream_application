# Manual-only unsigned compile gates. No triggers, secrets, signing or publishing.
workflows:
  ios-compile-check:
    name: iOS viewer unsigned compile check
    working_directory: project
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.41.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Viewer checks and unsigned compile
        script: bash ios/Publisher/ci_compile.sh viewer
    artifacts:
      - $CM_BUILD_DIR/project/build/ci-logs/*.log
      - $CM_BUILD_DIR/project/build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-publisher-compile-check:
    name: iOS experimental publisher unsigned compile check
    working_directory: project
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.41.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Enable publisher, compile and restore viewer
        script: bash ios/Publisher/ci_compile.sh publisher
    artifacts:
      - $CM_BUILD_DIR/project/build/ci-logs/*.log
      - $CM_BUILD_DIR/project/build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log
