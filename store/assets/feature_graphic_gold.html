<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hadayah Live feature graphic 1024x500 (Hidayah Gold)</title>
<!--
  Source of store/assets/feature_graphic_1024x500_gold.png (Play feature graphic, 1024x500, opaque).
  Hidayah Gold: the app's current design (gold mark on night slate), tokens from
  project/lib/core/theme/hidayah_gold.dart. Regenerate from the repo root:
  "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --disable-gpu --hide-scrollbars
    --force-device-scale-factor=1 --window-size=1024,500
    --screenshot="store\assets\feature_graphic_1024x500_gold.png" "file:///<repo>/store/assets/feature_graphic_gold.html"
-->
<style>
  @font-face { font-family: 'Plex Arabic'; font-weight: 700; src: url('../../project/assets/fonts/IBMPlexSansArabic-700.ttf'); }
  @font-face { font-family: 'Plex Arabic'; font-weight: 400; src: url('../../project/assets/fonts/IBMPlexSansArabic-400.ttf'); }
  @font-face { font-family: 'Plex'; font-weight: 400 700; src: url('../../project/assets/fonts/IBMPlexSans-Variable.ttf'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background:
      radial-gradient(520px 420px at 22% 52%, rgba(210, 169, 95, 0.20), rgba(210, 169, 95, 0) 70%),
      linear-gradient(135deg, #0B1117 0%, #151D24 55%, #242E37 100%);
    color: #FFFFFF;
    position: relative;
    font-family: 'Plex', 'Plex Arabic', sans-serif;
  }
  .lattice {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(45deg, rgba(226, 195, 137, 0.045) 1px, transparent 1px),
      linear-gradient(-45deg, rgba(226, 195, 137, 0.045) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .logo {
    position: absolute; left: 70px; top: 96px; width: 360px;
    filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45));
  }
  .copy { position: absolute; left: 470px; right: 70px; top: 96px; }
  .ar-title {
    font-family: 'Plex Arabic', sans-serif; font-weight: 700; font-size: 92px; line-height: 1.15;
    direction: rtl; text-align: left; color: #F7E6AD;
  }
  .en-title {
    font-weight: 700; font-size: 40px; letter-spacing: 0.5px; margin-top: 4px; color: #E2C389;
  }
  .rule { width: 84px; height: 5px; border-radius: 3px; background: #C1923B; margin: 26px 0 22px; }
  .tag-en { font-size: 25px; font-weight: 500; line-height: 1.35; color: #F3F6F8; }
  .tag-ar {
    font-family: 'Plex Arabic', sans-serif; font-size: 25px; line-height: 1.5; margin-top: 10px;
    direction: rtl; text-align: left; color: #CED5DB;
  }
</style>
</head>
<body>
  <div class="lattice"></div>
  <img class="logo" src="../../project/assets/logo/clearlogo2.png" alt="">
  <div class="copy">
    <div class="ar-title">منصة هدايه</div>
    <div class="en-title">Hadayah Live</div>
    <div class="rule"></div>
    <div class="tag-en">Live lectures &middot; Channels &middot; Venues</div>
    <div class="tag-ar">محاضرات مباشرة · قنوات · أماكن</div>
  </div>
</body>
</html>
